name: Deploy Music Letter to Pages

on:
  push:
    branches: ["claude/quirky-galileo-jkp646"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p public
          cp examples/cheer/letter.html   public/cheer.html
          cp examples/longing/letter.html public/longing.html
          cat > public/index.html <<'HTML'
          <!doctype html><html lang="ko"><head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>🎵 Music Letter</title>
          <style>
            body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
              background:radial-gradient(1200px 600px at 50% -10%,#243152 0%,#0e1320 55%);color:#eef1f8;line-height:1.7}
            .wrap{max-width:560px;margin:0 auto;padding:48px 20px}
            h1{font-size:34px;margin:0}
            p{color:#97a0b8}
            a.card{display:block;margin:16px 0;padding:20px 22px;border:1px solid #2a3450;border-radius:16px;
              background:linear-gradient(180deg,#1b2238,#161d2f);color:#eef1f8;text-decoration:none}
            a.card b{font-size:18px}
            a.card span{display:block;color:#97a0b8;font-size:13px;margin-top:4px}
          </style></head><body><div class="wrap">
          <h1>🎵 Music Letter</h1>
          <p>감정을 노래·그림·편지로 만들어 보내는 음악편지. 아래에서 완성본을 열어보세요.</p>
          <a class="card" href="cheer.html"><b>다시, 시작</b><span>응원 / 새로운 시작</span></a>
          <a class="card" href="longing.html"><b>보고 싶다는 말</b><span>그리움 / 보고싶음</span></a>
          </div></body></html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>💌 음악편지 — 다시, 시작</title>
<style>
  :root{
    --bg:#0f1410; --card:#19231a; --bg2:#141d16; --ink:#f1f5ee;
    --muted:#9fb29c; --gold:#f3c969; --green:#86d49a; --line:#2c3a2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#314a2e 0%,var(--bg) 55%);color:var(--ink);line-height:1.7}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 70px}
  .from{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.08em;margin-bottom:14px}

  /* 1) 제목이 박힌 커버 이미지 */
  .cover{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .cover img{width:100%;display:block}

  /* 2) 음원 플레이어 */
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;margin:16px 0}
  audio{width:100%}
  .cap{color:var(--muted);font-size:12px;margin:8px 0 0}

  /* 3) 편지 본문 */
  .letter{font-family:"Nanum Myeongjo","Noto Serif KR",serif;white-space:pre-wrap}
  .letter .open{font-weight:700;margin:0 0 12px}
  .letter .body{margin:0}
  .letter .close{color:var(--gold);text-align:right;margin:16px 0 0}

  /* 4) 이메일로 보내기 */
  .send h3{margin:0 0 10px;font-size:15px}
  .send-row{display:flex;gap:8px}
  .send input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:#10180e;color:var(--ink);font-size:14px}
  .send button{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;
    background:linear-gradient(135deg,var(--green),#5fb377);color:#0b1410;cursor:pointer;white-space:nowrap}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="from">🎵 누군가 당신에게 음악편지를 보냈어요</div>

    <!-- 1) 제목이 들어간 커버 이미지 -->
    <div class="cover">
      <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3Ehb0pJX3jTx2KyxLmSmtUAC7t1/hf_20260617_055911_750aae2e-82e5-4767-a711-25a5c5ac274c.png"
           alt="다시, 시작" />
    </div>

    <!-- 2) 음원 플레이어 -->
    <div class="card">
      <audio controls
        src="https://d8j0ntlcm91z4.cloudfront.net/user_3Ehb0pJX3jTx2KyxLmSmtUAC7t1/hf_20260617_055530_8a92a480-b676-4b4c-ba9a-5a87f12f30a5.m4a"></audio>
      <p class="cap">🎧 다시, 시작 — 실제 생성한 음악 (Higgsfield, 96 BPM)</p>
    </div>

    <!-- 3) 편지 본문 -->
    <div class="card letter">
      <p class="open">민준에게,</p>
      <p class="body">새로운 길 앞에서 떨리는 거, 그게 네가 진심이라는 증거야.
잘하지 않아도 괜찮아. 그냥 한 걸음만 내디뎌 봐.
넘어지면 손 잡아줄게. 멀리서도 늘 네 편으로 응원하고 있어.
너는 생각보다 훨씬 강한 사람이야.</p>
      <p class="close">— 언제나 네 편인 사람이.</p>
    </div>

    <!-- 4) 이메일 주소로 보내기 -->
    <div class="card send">
      <h3>💌 이 음악편지를 이메일로 보내기</h3>
      <div class="send-row">
        <input id="to" type="email" placeholder="받는 사람 이메일 (name@example.com)" />
        <button onclick="sendLetter()">보내기</button>
      </div>
    </div>

    <div class="foot">Music Letter · 제목 이미지 · 음원 · 편지 · 이메일 발송 · v0.2</div>
  </div>

  <script>
    // 독립 실행(standalone)에서는 mailto로 메일 앱을 열어 전송.
    // 앱 서버에서 열리면 POST /api/send 로 실제 SMTP 발송됩니다.
    function sendLetter(){
      var to = document.getElementById('to').value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ alert('올바른 이메일 주소를 입력해 주세요.'); return; }
      var subject = '🎵 음악편지 — 다시, 시작';
      var body =
        '누군가 당신에게 음악편지를 보냈어요.\n\n'+
        '🎬 커버: https://d8j0ntlcm91z4.cloudfront.net/user_3Ehb0pJX3jTx2KyxLmSmtUAC7t1/hf_20260617_055911_750aae2e-82e5-4767-a711-25a5c5ac274c.png\n'+
        '🎧 노래: https://d8j0ntlcm91z4.cloudfront.net/user_3Ehb0pJX3jTx2KyxLmSmtUAC7t1/hf_20260617_055530_8a92a480-b676-4b4c-ba9a-5a87f12f30a5.m4a\n\n'+
        '민준에게,\n새로운 길 앞에서 떨리는 거, 그게 네가 진심이라는 증거야.\n'+
        '잘하지 않아도 괜찮아. 그냥 한 걸음만 내디뎌 봐.\n'+
        '넘어지면 손 잡아줄게. 멀리서도 늘 네 편으로 응원하고 있어.\n'+
        '너는 생각보다 훨씬 강한 사람이야.\n\n— 언제나 네 편인 사람이.';
      window.location.href = 'mailto:'+encodeURIComponent(to)+
        '?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    }
  </script>
</body>
</html>
